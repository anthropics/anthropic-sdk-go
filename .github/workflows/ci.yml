name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ${{ github.repository == 'anthropics/anthropic-sdk-go' && 'ubuntu-latest' || 'ubuntu-latest-4-core' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        env:
          # Run setup-go's own go commands on the installed Go. Otherwise a newer
          # toolchain named in go.mod is downloaded before the cache is restored, and
          # the restore fails on the downloaded files. Later steps do switch to it.
          GOTOOLCHAIN: local
        with:
          go-version-file: ./go.mod

      - name: Run lints
        run: ./scripts/lint
  test:
    timeout-minutes: 10
    name: test
    runs-on: ${{ github.repository == 'anthropics/anthropic-sdk-go' && 'ubuntu-latest' || 'ubuntu-latest-4-core' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        env:
          # Run setup-go's own go commands on the installed Go. Otherwise a newer
          # toolchain named in go.mod is downloaded before the cache is restored, and
          # the restore fails on the downloaded files. Later steps do switch to it.
          GOTOOLCHAIN: local
        with:
          go-version-file: ./go.mod

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test

  detect_breaking_changes:
    timeout-minutes: 10
    name: detect-breaking-changes
    runs-on: ${{ github.repository == 'anthropics/anthropic-sdk-go' && 'ubuntu-latest' || 'ubuntu-latest-4-core' }}
    if: |-
      (github.event_name == 'push' &&
       !startsWith(github.ref, 'refs/heads/release-please--')) ||
      github.event.pull_request.head.repo.fork
    steps:
      # fetch-depth: 0 fetches full commit history (all branches and
      # tags, so the base ref is available) so `git merge-base`
      # below can resolve the fork point. filter: blob:none keeps the
      # fetch cheap: commit metadata is downloaded eagerly, file blobs
      # only when a later git command needs them.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        env:
          # Run setup-go's own go commands on the installed Go. Otherwise a newer
          # toolchain named in go.mod is downloaded before the cache is restored, and
          # the restore fails on the downloaded files. Later steps do switch to it.
          GOTOOLCHAIN: local
        with:
          go-version-file: ./go.mod

      - name: Determine base SHA
        run: |
          # A breaking-change-baseline tag, when the repo keeps one, marks the API
          # surface to compare against; it is moved by force, so refetch it.
          git fetch --quiet --force origin '+refs/tags/breaking-change-baseline:refs/tags/breaking-change-baseline' 2>/dev/null || true
          if git rev-parse --quiet --verify 'refs/tags/breaking-change-baseline^{commit}' >/dev/null; then
            BASE_REF='refs/tags/breaking-change-baseline'
          elif git rev-parse --quiet --verify 'origin/main^{commit}' >/dev/null; then
            BASE_REF='origin/main'
          else
            echo 'No breaking-change-baseline tag or origin/main to compare against; skipping.'
            echo "BASE_SHA=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Comparing against $BASE_REF"
          BASE_SHA=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || echo "")
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Download the base commit's files
        if: env.BASE_SHA != ''
        run: |
          # scripts/detect-breaking-changes restores old files with `git checkout <commit> -- <path>`, which downloads each
          # file this clone lacks in a separate request. So first download all the base commit's missing files in one request.
          # Without noop, git tells the server which commits this clone has, and the server leaves out those commits' files.
          MISSING=$(git rev-list --objects --no-walk --missing=print "$BASE_SHA" | sed -n 's/^?//p') || true
          # Never run the fetch with an empty list: git would then fetch branches, not files.
          if [ -z "$MISSING" ]; then
            echo "Found no files of base commit $BASE_SHA left to download."
          elif echo "$MISSING" | git -c fetch.negotiationAlgorithm=noop fetch --quiet --no-tags --no-write-fetch-head --stdin origin; then
            echo "Downloaded the $(echo "$MISSING" | wc -l) missing file(s) of base commit $BASE_SHA in one request."
          else
            echo "::warning::Could not download the files of base commit $BASE_SHA in one request (the error is in the log of the Download the base commit's files step, which still passes). The rest of the job will try to download the files it needs one at a time, which is slower."
          fi

      - name: Detect breaking changes
        if: env.BASE_SHA != ''
        run: |
          # Try to check out previous versions of the breaking change detection script. This ensures that
          # we still detect breaking changes when entire files and their tests are removed.
          git checkout "$BASE_SHA" -- ./scripts/detect-breaking-changes 2>/dev/null || true
          ./scripts/detect-breaking-changes "$BASE_SHA"
